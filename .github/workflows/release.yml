name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Проверки и сборка
        run: |
          ./scripts/check-public-tree.sh
          ./gradlew --no-daemon test lint assembleRelease
      - name: Контрольная сумма
        run: shasum -a 256 app/build/outputs/apk/release/app-release-unsigned.apk > app-release-unsigned.apk.sha256
      - name: Предварительный релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-unsigned.apk.sha256 \
            --title "Dictate $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            --notes "Универсальная интеграция RecognitionService пока не проверена на реальном устройстве. APK не подписан релизным ключом."
