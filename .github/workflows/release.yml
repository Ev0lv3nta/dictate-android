name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Тег принадлежит основной ветке
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Проверки и сборка
        run: |
          ./scripts/check-public-tree.sh
          ./gradlew --no-daemon test lintDebug lintRelease assembleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release
          path: "**/build/outputs/apk/release/*-unsigned.apk"
          if-no-files-found: error

  publish:
    needs: verify
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Собрать проверенный commit
        run: ./gradlew --no-daemon assembleRelease
      - name: Подписать APK
        env:
          DICTATE_KEYSTORE_BASE64: ${{ secrets.DICTATE_KEYSTORE_BASE64 }}
          DICTATE_STORE_PASSWORD: ${{ secrets.DICTATE_STORE_PASSWORD }}
        run: bash scripts/sign-release.sh
      - name: Проверить версию
        run: |
          version=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name build/release/dictate.apk)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Создать предварительный релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/dictate.apk build/release/dictate-sample.apk build/release/SHA256SUMS \
            --title "Dictate $GITHUB_REF_NAME" \
            --prerelease --draft \
            --notes-file docs/release-notes.md
